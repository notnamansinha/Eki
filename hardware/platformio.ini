[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
    -D DISABLE_OTA

lib_deps =
    mikalhart/TinyGPSPlus @ 1.1.0
    bblanchon/ArduinoJson @ 7.4.3

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = -std=gnu++11
