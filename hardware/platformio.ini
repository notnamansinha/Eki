[platformio]
default_envs = esp32dev

[env]
platform = espressif32@7.0.1
monitor_speed = 115200
lib_deps =
    mikalhart/TinyGPSPlus @ 1.1.0
    bblanchon/ArduinoJson @ 7.4.3

[env:esp32dev]
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
build_flags =
    -D DISABLE_OTA
    -D EKI_FLEET_BUILD=0
    -D EKI_FIRMWARE_VERSION=\"development\"

; This is the only environment authorized for fleet artifacts. The checked-in
; sdkconfig enables on-device release-mode flash encryption, NVS encryption,
; and Secure Boot V2. The ignored RSA-3072 signing key is deliberately required
; so an unsigned fleet build fails instead of silently weakening the image.
[env:esp32dev-secure]
board = esp32dev
framework = arduino, espidf
board_build.partitions = partitions_secure.csv
board_build.secure_boot_signing_key = keys/secure_boot_signing_key.pem
extra_scripts = pre:scripts/verify_secure_fleet.py
build_flags =
    -D DISABLE_OTA
    -D EKI_FLEET_BUILD=1
    -D EKI_FIRMWARE_VERSION=\"gnss-nvs-v1\"

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = -std=gnu++11
