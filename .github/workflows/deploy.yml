# Deploys the web app + security rules to the Eki Firebase project on every
# green main build, and to production only via an explicit, approval-gated
# workflow_dispatch (issue #39 M4).
#
# Project targeting is explicit everywhere: staging uses the approved staging
# project configured in this workflow. The production job remains an explicit,
# approval-gated target until a separate production project is provisioned.
#
# Required GitHub secrets (environment-scoped):
#   staging / production environments each need:
#   - FIREBASE_TOKEN: a Firebase CLI CI token for that project
#   - FIREBASE_DATABASE_URL: the backend's deployed RTDB instance origin
#   - NEXT_PUBLIC_FIREBASE_API_KEY, NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,
#     NEXT_PUBLIC_FIREBASE_DATABASE_URL, NEXT_PUBLIC_FIREBASE_PROJECT_ID,
#     NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET, NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,
#     NEXT_PUBLIC_FIREBASE_APP_ID, NEXT_PUBLIC_GOOGLE_MAPS_API_KEY,
#     NEXT_PUBLIC_GOOGLE_MAP_ID,
#     NEXT_PUBLIC_BACKEND_URL
#
# Optional backend job (staging, manual dispatch only, issue #371). It needs no
# GitHub secrets or variables: the workload identity provider and the deploy
# service account are fixed in the job, and the region is the cloud_run_region
# dispatch input. The Artifact Registry repository `eki` shall exist in that
# region, with roles/artifactregistry.writer granted to the deploy account.
name: Deploy

on:
  workflow_run:
    workflows: ["Production verification"]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      deploy_backend:
        description: Also build and deploy the backend to Cloud Run before the client release (staging only)
        required: false
        default: false
        type: boolean
      cloud_run_region:
        description: Region of the Cloud Run service and Artifact Registry (used only with deploy_backend)
        required: false
        default: asia-south2
        type: choice
        options:
          - asia-south2
          - us-central1
          - asia-southeast1

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  FIREBASE_CLI: npx --yes firebase-tools@15.14.0

jobs:
  deploy-backend-staging:
    # Manual only: dispatch from main with environment=staging and
    # deploy_backend=true. Automatic runs never start it. The client release
    # below waits for it, so a failed backend deploy stops the Hosting release.
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'staging' &&
      github.event.inputs.deploy_backend == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: bustrack-be165
      SERVICE: eki-backend-staging
      RUNTIME_SERVICE_ACCOUNT: eki-backend-runtime@bustrack-be165.iam.gserviceaccount.com
      AR_REPOSITORY: eki
      WORKLOAD_IDENTITY_PROVIDER: projects/449313371438/locations/global/workloadIdentityPools/github/providers/github-actions
      DEPLOY_SERVICE_ACCOUNT: eki-github-deployer@bustrack-be165.iam.gserviceaccount.com
      REGION: ${{ github.event.inputs.cloud_run_region }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Build and push the backend image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          image_tag="${REGION}-docker.pkg.dev/${GCP_PROJECT}/${AR_REPOSITORY}/backend:${GITHUB_SHA}"
          docker build -f backend/Dockerfile -t "$image_tag" .
          docker push "$image_tag"
          digest_ref="$(docker inspect --format '{{index .RepoDigests 0}}' "$image_tag")"
          echo "IMAGE=${digest_ref}" >> "$GITHUB_ENV"
          echo "Image: ${digest_ref}"
      - name: Deploy a candidate revision that receives no traffic
        run: |
          # The revision that serves traffic now, not merely the newest one: an
          # earlier candidate that failed the gate must not become the rollback target.
          # Only a missing service is a first deployment. Any other describe
          # failure stops here, because a first deployment skips the gate.
          if service_json="$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT" --region "$REGION" --format json 2>"$RUNNER_TEMP/describe.err")"; then
            previous="$(jq -r '[.status.traffic[]? | select((.percent // 0) > 0)] | sort_by(-.percent) | .[0].revisionName // empty' <<< "$service_json")"
          elif grep -q "Cannot find service" "$RUNNER_TEMP/describe.err"; then
            previous=""
          else
            cat "$RUNNER_TEMP/describe.err" >&2
            echo "::error::Could not read the service ${SERVICE}. Refusing to deploy without the /health gate."
            exit 1
          fi
          echo "PREVIOUS_REVISION=${previous}" >> "$GITHUB_ENV"
          if [ -n "$previous" ]; then
            TRAFFIC="$(printf '    - revisionName: %s\n      percent: 100\n    - latestRevision: true\n      percent: 0\n      tag: candidate' "$previous")"
          else
            TRAFFIC="$(printf '    - latestRevision: true\n      percent: 100')"
          fi
          export TRAFFIC IMAGE RUNTIME_SERVICE_ACCOUNT
          envsubst '${IMAGE} ${RUNTIME_SERVICE_ACCOUNT} ${TRAFFIC}' < deploy/cloud-run/staging.service.yaml > "$RUNNER_TEMP/service.yaml"
          gcloud run services replace "$RUNNER_TEMP/service.yaml" --project "$GCP_PROJECT" --region "$REGION"
      - name: Allow public invocation (application authentication stays the gate)
        run: >-
          gcloud run services add-iam-policy-binding "$SERVICE"
          --project "$GCP_PROJECT" --region "$REGION"
          --member allUsers --role roles/run.invoker --quiet
      - name: Gate on /health before promoting
        timeout-minutes: 5
        run: |
          service_json="$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT" --region "$REGION" --format json)"
          new_revision="$(jq -r '.status.latestCreatedRevisionName // empty' <<< "$service_json")"
          if [ -n "$PREVIOUS_REVISION" ]; then
            url="$(jq -r '[.status.traffic[]? | select(.tag == "candidate")][0].url // empty' <<< "$service_json")"
            candidate="$(jq -r '[.status.traffic[]? | select(.tag == "candidate")][0].revisionName // empty' <<< "$service_json")"
          else
            url="$(jq -r '.status.url // empty' <<< "$service_json")"
            candidate="$(jq -r '.status.latestReadyRevisionName // empty' <<< "$service_json")"
          fi
          # The candidate tag follows the latest ready revision. Gate only when it
          # is the revision this run created, never the one already serving.
          if [ -z "$url" ] || [ -z "$new_revision" ] || [ "$candidate" != "$new_revision" ] || [ "$candidate" = "$PREVIOUS_REVISION" ]; then
            echo "::error::The candidate URL does not serve the new revision ${new_revision:-unknown} (found ${candidate:-none})."
            exit 1
          fi
          echo "CANDIDATE_REVISION=${candidate}" >> "$GITHUB_ENV"
          # /health stays 503 until the first Firestore and RTDB probes succeed.
          # The deadline keeps the last attempt (10 s curl, 5 s sleep) inside the step timeout.
          deadline=$((SECONDS + 180))
          attempt=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            attempt=$((attempt + 1))
            body="$(curl -fsS --max-time 10 "${url}/health" 2>/dev/null || true)"
            if [ "$(jq -r '.status' <<< "$body" 2>/dev/null || true)" = "ok" ]; then
              echo "Candidate ${candidate} is healthy after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 5
          done
          if [ -n "$PREVIOUS_REVISION" ]; then
            echo "::error::The candidate never reported /health status ok within 3 minutes. Traffic stays on ${PREVIOUS_REVISION}."
          else
            echo "::error::The first revision never reported /health status ok within 3 minutes. It already serves all traffic."
          fi
          exit 1
      - name: Promote the candidate
        if: env.PREVIOUS_REVISION != ''
        run: |
          gcloud run services update-traffic "$SERVICE" --project "$GCP_PROJECT" --region "$REGION" --to-revisions "${CANDIDATE_REVISION}=100"
          gcloud run services update-traffic "$SERVICE" --project "$GCP_PROJECT" --region "$REGION" --remove-tags candidate
      - name: Record the release and the rollback command
        if: always()
        run: |
          {
            echo "### Backend release (staging)"
            echo "- Image: \`${IMAGE:-not built}\`"
            echo "- Previous revision: \`${PREVIOUS_REVISION:-none}\`"
            if [ -n "${PREVIOUS_REVISION:-}" ]; then
              echo "- Roll back with: \`gcloud run services update-traffic ${SERVICE} --project ${GCP_PROJECT} --region ${REGION} --to-revisions ${PREVIOUS_REVISION}=100\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    needs: deploy-backend-staging
    # Only deploy from a successful same-repository push run on main (a
    # workflow_run from a PR or fork could carry untrusted code), and only
    # allow manual dispatches from the main branch (audit #113). The backend
    # job is skipped on every run except a dispatch with deploy_backend=true;
    # a skipped backend job does not block the release, a failed one does.
    if: >
      !cancelled() &&
      (needs.deploy-backend-staging.result == 'success' ||
       needs.deploy-backend-staging.result == 'skipped') &&
      ((github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.environment == 'staging' &&
       github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deploy the exact SHA that produced the green verification run,
          # not whatever main points at now (audit #113). On dispatch, use the
          # dispatched commit, the same one the backend job built, even if main
          # moves while this job waits for it.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify backend/frontend RTDB target before staging release
        run: npm run verify:rtdb-instance
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${{ secrets.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}
          RTDB_EXPECTED_REGION: ${{ vars.RTDB_EXPECTED_REGION }}
      - name: Cache Next.js + backend TypeScript build caches
        # Same cache namespace as ci.yml so deploys reuse what verification built.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            frontend/.next/cache
            backend/dist
            backend/tsconfig.tsbuildinfo
          key: build-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json', 'frontend/package.json', 'frontend/tsconfig.json', 'frontend/next.config.ts', 'frontend/src/**', 'frontend/public/**', 'backend/package.json', 'backend/tsconfig.json', 'backend/src/**', 'scripts/generate-sw.mjs') }}
          restore-keys: |
            build-cache-${{ runner.os }}-
      - name: Strict production build (fail-closed env gate + CSP)
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${{ secrets.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_MAP_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAP_ID }}
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
        run: npm run build:production
      - name: Verify live backend readiness and browser access before staging release
        run: npm run verify:web-backend-contract
        env:
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
          EKI_STRICT_PRODUCTION_BUILD: "true"
          EKI_RUNTIME_SMOKE: "1"
          EKI_FRONTEND_ORIGIN: https://bustrack-be165.web.app
      - name: Disable Firebase App Check before staging deploy
        run: node scripts/disable-appcheck-enforcement.mjs --project bustrack-be165 --disable
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      - name: Deploy required Firestore indexes
        run: >-
          $FIREBASE_CLI deploy
          --project bustrack-be165
          --only firestore:indexes
          --non-interactive
          --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      - name: Wait for retention and privacy indexes
        timeout-minutes: 32
        run: node scripts/verify-firestore-indexes.mjs --project bustrack-be165
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      - name: Deploy to staging (hosting + rules)
        run: >-
          $FIREBASE_CLI deploy
          --project bustrack-be165
          --only hosting,firestore:rules,database:rules
          --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  deploy-production:
    # Manual production deploys are only allowed from main (audit #113); the
    # protected environment still requires an approving reviewer.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify backend/frontend RTDB target before production release
        run: npm run verify:rtdb-instance
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${{ secrets.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}
          RTDB_EXPECTED_REGION: ${{ vars.RTDB_EXPECTED_REGION }}
      - name: Cache Next.js + backend TypeScript build caches
        # Same cache namespace as ci.yml so deploys reuse what verification built.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            frontend/.next/cache
            backend/dist
            backend/tsconfig.tsbuildinfo
          key: build-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json', 'frontend/package.json', 'frontend/tsconfig.json', 'frontend/next.config.ts', 'frontend/src/**', 'frontend/public/**', 'backend/package.json', 'backend/tsconfig.json', 'backend/src/**', 'scripts/generate-sw.mjs') }}
          restore-keys: |
            build-cache-${{ runner.os }}-
      - name: Strict production build (fail-closed env gate + CSP)
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${{ secrets.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_MAP_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAP_ID }}
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
        run: npm run build:production
      - name: Verify live backend readiness and browser access before production release
        run: npm run verify:web-backend-contract
        env:
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
          EKI_STRICT_PRODUCTION_BUILD: "true"
          EKI_RUNTIME_SMOKE: "1"
          EKI_FRONTEND_ORIGIN: https://eki-production.web.app
      - name: Disable Firebase App Check before production deploy
        run: node scripts/disable-appcheck-enforcement.mjs --project eki-production --disable
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      - name: Deploy required Firestore indexes
        run: >-
          $FIREBASE_CLI deploy
          --project eki-production
          --only firestore:indexes
          --non-interactive
          --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      - name: Wait for retention and privacy indexes
        timeout-minutes: 32
        run: node scripts/verify-firestore-indexes.mjs --project eki-production
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      - name: Deploy to production (explicit project, never the default)
        run: >-
          $FIREBASE_CLI deploy
          --project eki-production
          --only hosting,firestore:rules,database:rules
          --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
