name: Production verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          # Unit tests import Firebase Admin but never contact RTDB. Admin still
          # requires a syntactically valid URL during module initialization.
          FIREBASE_DATABASE_URL: https://eki-unit-test-default-rtdb.firebaseio.com
      - name: Test Firebase authorization rules in emulators
        env:
          FIREBASE_RULES_TEST: "1"
        run: >-
          npx --yes firebase-tools@15.14.0 emulators:exec
          --only firestore,database
          --project eki-rules-test
          "npm run test --workspace=backend"
      - run: npm run build
      # Slow-3G/Offline browser acceptance remains a manual deployment gate;
      # see docs/operations/UNIVERSITY_DEPLOYMENT_CHECKLIST.md.
      - run: npm audit --omit=dev --omit=optional

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: platformio test --project-dir hardware -e native
      - run: platformio run --project-dir hardware -e esp32dev
      - name: Verify signed fleet build with an ephemeral CI-only key
        run: |
          mkdir -p hardware/keys
          openssl genrsa -out hardware/keys/secure_boot_signing_key.pem 3072
          platformio run --project-dir hardware -e esp32dev-secure
