name: Production verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Use runner-provided Java 21
        # ubuntu-latest already includes Java 21. Using the image-provided JDK
        # avoids a separate codeload.github.com action download, which can be
        # rate-limited before any repository tests get a chance to run.
        run: |
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
      - run: npm ci
      - name: Verify frontend/backend RTDB instance preflight
        run: npm run verify:rtdb-instance
        env:
          FIREBASE_DATABASE_URL: https://eki-unit-test-default-rtdb.firebaseio.com
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: https://eki-unit-test-default-rtdb.firebaseio.com
      - name: Cache Next.js + backend TypeScript build caches
        # Persistent Turbopack cache (.next/cache — includes the workbox SW
        # replay cache), the backend emitted output, and incremental build info.
        # The key hashes every build input so dependency or code changes get a fresh cache;
        # restore-keys falls back to the most recent compatible cache on
        # partial changes (Turbopack and tsc validate entries internally, so
        # a stale cache is safe — worst case it's simply not reused).
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            frontend/.next/cache
            backend/dist
            backend/tsconfig.tsbuildinfo
          key: build-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json', 'frontend/package.json', 'frontend/tsconfig.json', 'frontend/next.config.ts', 'frontend/src/**', 'frontend/public/**', 'backend/package.json', 'backend/tsconfig.json', 'backend/src/**', 'scripts/generate-sw.mjs') }}
          restore-keys: |
            build-cache-${{ runner.os }}-
      - name: Verify OpenAPI schemas and registered route coverage
        run: npm run verify:openapi
      - run: npm run lint
      - run: npm test
        env:
          # Unit tests import Firebase Admin but never contact RTDB. Admin still
          # requires a syntactically valid URL during module initialization.
          FIREBASE_DATABASE_URL: https://eki-unit-test-default-rtdb.firebaseio.com
      - name: Test Firebase authorization rules in emulators
        env:
          FIREBASE_RULES_TEST: "1"
        # Emulator rules tests run against App Check-free copies written to a
        # temp dir (scripts/run-rules-emulator.mjs); the committed rule files
        # are never modified (audit #113).
        run: node scripts/run-rules-emulator.mjs
      - name: Verify bounded admission under stalled dependencies
        run: |
          npm run build --workspace=backend
          node --expose-gc scripts/benchmark-work-admission.mjs
      - name: Install Chromium for admin access browser regression checks
        # Actual auth/App Check/guard/UI with synthetic SDK/data dependencies.
        run: npx playwright install --with-deps chromium
      - name: Verify admin access and feedback in mobile and desktop browsers
        run: npm run test:e2e:admin
      - name: Strict production build (fail-closed gate + CSP regeneration)
        # Issue #39 D1: the strict build (EKI_STRICT_PRODUCTION_BUILD) and the
        # CSP hash regeneration were never exercised in CI. Placeholder values
        # satisfy the fail-closed env gate; real secrets only exist in the
        # Deploy workflow's environment-scoped secrets.
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-only-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: eki-unit-test.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: https://eki-unit-test-default-rtdb.firebaseio.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: eki-unit-test
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: eki-unit-test.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:0000000000000000000000
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ci-only-placeholder
          NEXT_PUBLIC_GOOGLE_MAP_ID: ci-only-placeholder
          NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY: ci-only-placeholder
          NEXT_PUBLIC_BACKEND_URL: https://ci-only.example.invalid
          NEXT_PUBLIC_SITE_URL: https://canonical-ci.example.invalid
          NEXT_PUBLIC_SITE_INDEXING: "true"
        run: npm run build:production
      - name: Verify exported canonical, social and crawler origins
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const origin = 'https://canonical-ci.example.invalid';
          const html = readFileSync('frontend/out/index.html', 'utf8');
          const canonical = html.match(/<link rel="canonical" href="([^"]+)"/)[1];
          const ogUrl = html.match(/<meta property="og:url" content="([^"]+)"/)[1];
          const ogImage = html.match(/<meta property="og:image" content="([^"]+)"/)[1];
          assert.equal(new URL(canonical).href, `${origin}/`);
          assert.equal(new URL(ogUrl).href, `${origin}/`);
          assert.equal(new URL(ogImage).origin, origin);
          assert(readFileSync('frontend/out/robots.txt', 'utf8').includes(`Sitemap: ${origin}/sitemap.xml`));
          assert(readFileSync('frontend/out/sitemap.xml', 'utf8').includes(`<loc>${origin}/</loc>`));
          JS
      # Slow-3G/Offline browser acceptance remains a manual deployment gate;
      # see docs/operations/UNIVERSITY_DEPLOYMENT_CHECKLIST.md.
      - run: npm audit --omit=dev --omit=optional
      - name: Audit development tooling as well as runtime dependencies
        run: npm audit

  backend-image:
    # Issue #28: the backend runs as replicated containers, so the exact image
    # that would be scaled must build and boot on every push. The smoke step
    # boots it with placeholder env (no real Firebase) and asserts the health
    # endpoint answers: the process is live, production config fails closed
    # correctly, and /health serves the degraded body the load balancer relies
    # on when a dependency is unreachable.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build backend container image
        run: docker build -f backend/Dockerfile -t eki-backend:ci .
      - name: Smoke-boot the container and verify liveness plus degraded readiness
        run: |
          docker run -d --name eki-backend-smoke \
            -e NODE_ENV=production \
            -e CORS_ORIGIN=https://ci-only.example.invalid \
            -e RETENTION_SWEEPER_ENABLED=true \
            -e FIREBASE_DATABASE_URL=https://eki-unit-test-default-rtdb.firebaseio.com \
            -p 8080:8080 eki-backend:ci
          # Wait until the HTTP server answers (a 503 still counts: it proves
          # the process is live; only connection failures keep looping).
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8080/health; then break; fi
            sleep 1
          done
          # Placeholder Firebase can never be reached, so readiness is 503 with
          # a degraded body — the exact contract an LB health check consumes.
          http_code="$(curl -s -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8080/health)"
          test "$http_code" = "503"
          grep -q '"status":"degraded"' /tmp/health.json
          live_code="$(curl -s -o /tmp/live.json -w '%{http_code}' http://127.0.0.1:8080/live)"
          test "$live_code" = "200"
          grep -q '"status":"alive"' /tmp/live.json
          test "$(docker inspect --format '{{.Config.Healthcheck.Test}}' eki-backend-smoke)" = '[CMD-SHELL wget -qO- http://127.0.0.1:8080/live || exit 1]'
          docker logs eki-backend-smoke

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Install non-production firmware build configuration
        run: cp hardware/include/secrets.example.h hardware/include/secrets.h
      - run: platformio test --project-dir hardware -e native
      - name: Keep firmware runtime reachable in build verification
        # The example's short secret intentionally fails boot validation.
        # A valid-length fake secret avoids optimizing all network/task code
        # away; this fixture has no usable device credentials.
        run: sed -i 's/replace-me/ci-only-not-a-real-device-secret/' hardware/include/secrets.h
      - run: platformio run --project-dir hardware -e esp32dev
      - name: Build quiet development runtime for trace-gating verification
        run: platformio run --project-dir hardware -e esp32dev-quiet
      - name: Verify trace strings are removed from the quiet artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          marker = b"[TelemetryTrace]"
          assert marker in Path("hardware/.pio/build/esp32dev/firmware.elf").read_bytes()
          assert marker not in Path("hardware/.pio/build/esp32dev-quiet/firmware.elf").read_bytes()
          PY
      - name: Verify pre-application SNTP guard is linked
        run: |
          "$HOME/.platformio/packages/toolchain-xtensa-esp32/bin/xtensa-esp32-elf-nm" hardware/.pio/build/esp32dev/firmware.elf | grep -E ' T sntp_sync_time$'
      - name: Build legacy app-only journal acceptance firmware
        run: platformio run --project-dir hardware -e esp32dev-journal
      - name: Verify signed fleet build with an ephemeral CI-only key
        run: |
          mkdir -p hardware/keys
          openssl genrsa -out hardware/keys/secure_boot_signing_key.pem 3072
          platformio run --project-dir hardware -e esp32dev-secure
