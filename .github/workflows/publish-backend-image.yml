name: Publish backend image

# Backup deployment path (not used by the Cloud Run staging deploy): publishes
# the backend image to Docker Hub so any Docker host, such as a VPS, can pull
# it. It runs only after "Production verification" succeeds on main, and it
# does nothing until the DOCKERHUB_* secrets exist, so merging it is safe.
on:
  workflow_run:
    workflows: ["Production verification"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-backend-image
  cancel-in-progress: false

jobs:
  publish:
    # Manual runs publish the dispatched commit; automatic runs only follow a green main.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check for Docker Hub credentials
        id: creds
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set; skipping publish."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.enabled == 'true'
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Build backend image
        if: steps.creds.outputs.enabled == 'true'
        run: |
          image="${DOCKERHUB_USERNAME}/eki-backend"
          docker build -f backend/Dockerfile -t "${image}:${SOURCE_SHA}" -t "${image}:latest" .
      - name: Scan image for high-severity vulnerabilities
        if: steps.creds.outputs.enabled == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.DOCKERHUB_USERNAME }}/eki-backend:${{ env.SOURCE_SHA }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
      - name: Push to Docker Hub
        if: steps.creds.outputs.enabled == 'true'
        run: |
          image="${DOCKERHUB_USERNAME}/eki-backend"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker push "${image}:${SOURCE_SHA}"
          docker push "${image}:latest"
          {
            echo "### Published backend image"
            echo "- \`${image}:${SOURCE_SHA}\`"
            echo "- \`${image}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
